name: Собрать APK

# Запускается вручную (кнопка Run workflow) или на каждый push.
# Готовый APK появляется в разделе Actions -> нужный запуск -> Artifacts.

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Установить buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "cython==0.29.36"

      - name: Кеш Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Собрать debug APK
        run: buildozer -v android debug

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: zmeika-debug-apk
          path: bin/*.apk
          if-no-files-found: error
