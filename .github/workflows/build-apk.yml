name: Собрать APK

# Запускается вручную (кнопка Run workflow) или при изменениях Android-части.
# Сборка идёт в официальном образе kivy/buildozer: внутри уже JDK, Android
# SDK/NDK и совместимые версии buildozer и python-for-android. Так не зависим
# от того, какой Python стоит на раннере (с Python 3.14 у p4a ломается venv).
# Готовый APK: Actions -> запуск -> Artifacts -> zmeika-debug-apk.

on:
  push:
    paths:
      - "main.py"
      - "snake.py"
      - "buildozer.spec"
      - "build.sh"
      - "icon.png"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Кеш Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer-cache
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Собрать APK в образе kivy/buildozer
        run: |
          mkdir -p "$HOME/.buildozer-cache"
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            -v "$HOME/.buildozer-cache":/home/user/.buildozer \
            kivy/buildozer -v android debug

      - name: Проверить, что APK создан
        run: |
          ls -lh bin/*.apk

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: zmeika-debug-apk
          path: bin/*.apk
          if-no-files-found: error
